<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment — Dr. Mirzoyev Dental Clinic</title>
  <meta name="description" content="Book your dental appointment online with Dr. Mirzoyev. Quick and easy scheduling.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <div class="scroll-progress" id="scrollProgress"></div>
  <div class="custom-cursor" id="customCursor"></div>
  <header class="header" id="header"><div class="header__inner"><a href="/" class="header__logo"><svg class="header__logo-icon" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="1.5"/><path d="M20 10c-2.5 0-4.5 1-5.5 3-1.5 3-1 7 0.5 11 1 2.5 2.5 5.5 5 6.5 2.5-1 4-4 5-6.5 1.5-4 2-8 0.5-11-1-2-3-3-5.5-3z" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.2"/></svg><span class="header__logo-text">Dr. <span>Mirzoyev</span></span></a><nav class="header__nav"><ul class="nav__list"><li><a href="/#services" class="nav__link" data-i18n="nav.services">Services</a></li><li><a href="gallery.html" class="nav__link" data-i18n="nav.gallery">Before & After</a></li><li><a href="/#trust" class="nav__link" data-i18n="nav.about">About</a></li><li><a href="testimonials.html" class="nav__link" data-i18n="nav.reviews">Reviews</a></li><li><a href="blog.html" class="nav__link" data-i18n="nav.blog">Blog</a></li><li><a href="contacts.html" class="nav__link" data-i18n="nav.contacts">Contacts</a></li></ul></nav><div class="header__actions"><div class="lang-switcher" id="langSwitcher"><button class="lang-switcher__btn lang-switcher__btn--active" data-lang="en">EN</button><button class="lang-switcher__btn" data-lang="ua">UA</button></div></div><button class="header__burger" id="burgerBtn" aria-label="Toggle menu"><span></span><span></span><span></span></button></div></header>
  <div class="mobile-nav" id="mobileNav"><ul class="mobile-nav__list"><li><a href="/#services" class="mobile-nav__link">Services</a></li><li><a href="gallery.html" class="mobile-nav__link">Before & After</a></li><li><a href="contacts.html" class="mobile-nav__link">Contacts</a></li></ul><div class="lang-switcher" id="langSwitcherMobile"><button class="lang-switcher__btn lang-switcher__btn--active" data-lang="en">EN</button><button class="lang-switcher__btn" data-lang="ua">UA</button></div></div>

  <main>
    <section class="booking-section">
      <div class="container" style="padding-top: calc(var(--header-height) + var(--space-16));">
        <div class="booking-section__header">
          <span class="section-label" data-i18n="nav.book">Book Appointment</span>
          <h1 class="section-title" data-i18n="booking.title">Book Your Appointment</h1>
          <p class="section-subtitle mx-auto" data-i18n="booking.subtitle">Choose a convenient time and we'll take care of the rest.</p>
        </div>

        <form class="booking-form" id="bookingForm">
          <div class="form-group">
            <label class="form-label" data-i18n="booking.service">Select Service</label>
            <select class="form-select" name="service" required>
              <option value="">Choose a service...</option>
              <option value="consultation">Consultation</option>
              <option value="implantology">Implantology</option>
              <option value="whitening">Whitening</option>
              <option value="veneers">Veneers</option>
              <option value="pediatric">Pediatric Dentistry</option>
              <option value="emergency">Emergency Care</option>
            </select>
          </div>
          <div class="booking-form__row">
            <div class="form-group">
              <label class="form-label" data-i18n="booking.date">Preferred Date</label>
              <input type="date" class="form-input" name="date" required>
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="booking.time">Preferred Time</label>
              <input type="time" class="form-input" name="time" required>
            </div>
          </div>
          <div class="booking-form__row">
            <div class="form-group">
              <label class="form-label" data-i18n="booking.name">Full Name</label>
              <input type="text" class="form-input" name="name" placeholder="John Smith" data-i18n-placeholder="booking.name" required>
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="booking.phone">Phone Number</label>
              <input type="tel" class="form-input" name="phone" placeholder="+380 XX XXX XX XX" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="booking.email">Email Address</label>
            <input type="email" class="form-input" name="email" placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="booking.message">Additional Notes (optional)</label>
            <textarea class="form-textarea" name="message" rows="4" placeholder="Any special requests or information..." data-i18n-placeholder="booking.message"></textarea>
          </div>
          <div class="booking-form__submit">
            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;" data-i18n="booking.submit">Confirm Appointment</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer"><div class="container footer__inner"><div class="footer__bottom"><span data-i18n="footer.copy">&copy; 2024 Dr. Mirzoyev Dental Clinic.</span></div></div></footer>
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
